default_job = "check"

# Default bacon jobs.
[jobs.check]
command = ["cargo", "check", "--color", "always", "--all-targets"]

[jobs.clippy]
command = ["cargo", "clippy", "--color", "always", "--all-targets"]

[jobs.test]
command = ["cargo", "test", "--color", "always"]

[jobs.run]
command = ["cargo", "run", "--color", "always", "-p", "cindral-app"]
need_stdout = true
allow_warnings = true

# Optimized release preview; not a replacement for dev debug assertions.
[jobs.run-release]
command = ["cargo", "run", "--color", "always", "--release", "-p", "cindral-app"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
kill = ["kill", "-s", "INT"]
