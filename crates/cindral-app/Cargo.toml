[package]
name = "cindral-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cindral-render = { path = "../cindral-render" }
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
glam = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "renderer_benchmark"
test = true

[dependencies.cindral-core]
path = "../cindral-core"

[dependencies.cindral-inference]
path = "../cindral-inference"

[dependencies.cindral-tools]
path = "../cindral-tools"

[features]
kernel-benchmark = ["cindral-core/bench-fixtures"]

[[example]]
name = "kernel_gpu_benchmark"
required-features = ["kernel-benchmark"]

[[example]]
name = "component_benchmark"
required-features = ["kernel-benchmark"]

[dependencies.cindral-io]
path = "../cindral-io"

[dependencies.rfd]
version = "0.17"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "import_pushpull_benchmark"
required-features = ["kernel-benchmark"]

[[example]]
name = "import_pushpull_gpu"
required-features = ["kernel-benchmark"]

[[example]]
name = "real_file_benchmark"
required-features = ["kernel-benchmark"]

[dependencies.png]
version = "0.18"

[dependencies.tempfile]
version = "3"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[[example]]
name = "png_benchmark"
required-features = ["kernel-benchmark"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[[example]]
name = "rotate_benchmark"
required-features = ["kernel-benchmark"]
