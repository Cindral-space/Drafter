[package]
name = "cindral-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cindral-skp = { path = "../cindral-skp" }
cindral-core = { path = "../cindral-core" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
zip = { version = "3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.11"
base64 = "0.22"
roxmltree = "0.20"

[features]
bench-fixtures = ["cindral-core/bench-fixtures"]

[[example]]
name = "file_benchmark"
required-features = ["bench-fixtures"]
