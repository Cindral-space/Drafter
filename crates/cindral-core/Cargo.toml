[package]
name = "cindral-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
earcutr = "0.5"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
bench-fixtures = []

[[example]]
name = "kernel_benchmark"
required-features = ["bench-fixtures"]

[dependencies.rstar]
version = "0.12"

[[example]]
name="connected_benchmark"
required-features=["bench-fixtures"]
